services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: meridian
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: ${DB_PASSWORD:-meridian_dev_only}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian -d meridian"]
      interval: 5s
      timeout: 5s
      retries: 15
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/meridian
      DB_USER: meridian
      DB_PASSWORD: ${DB_PASSWORD:-meridian_dev_only}
      JWT_SECRET: ${JWT_SECRET:-local-development-only-secret-change-me-before-deployment-1234567890}
      CORS_ORIGIN: http://localhost:3000
      SEED_DEMO: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:80"
volumes:
  db_data:
